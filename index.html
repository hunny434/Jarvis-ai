
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HUNNY AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#07111f;color:white;
 font-family:Arial;text-align:center;padding:20px;
}
h1{color:#42d9ff;margin-top:25px}
.orb{
 width:145px;height:145px;border-radius:50%;
 margin:35px auto;background:#102d55;
 border:3px solid #42d9ff;
 box-shadow:0 0 35px #168cff;
 display:grid;place-items:center;font-size:48px;
}
button{
 padding:15px;margin:7px;border:0;border-radius:12px;
 background:#087ed5;color:white;font-size:16px;
}
#status{color:#42d9ff;margin:20px}
#answer{
 background:#10233c;padding:20px;border-radius:15px;
 min-height:65px;margin-top:20px;
}
input{
 width:90%;padding:14px;border-radius:10px;
 border:0;margin-top:20px;font-size:16px;
}
</style>
</head>
<body>
<h1>⚡ HUNNY AI ⚡</h1>
<p>Your Personal Assistant</p>
<div class="orb">🤖</div>
<h3 id="status">HUNNY AI तैयार है</h3>

<button onclick="listen()">🎙️ बोलो</button>
<button onclick="speak('नमस्ते Hunny! मैं तैयार हूँ।')">🔊 आवाज़ टेस्ट</button>

<div id="answer">नमस्ते Hunny! मुझसे बात करो।</div>

<input id="msg" placeholder="यहाँ कुछ लिखो...">
<button onclick="send()">Send</button>

<script>
const answer=document.getElementById("answer");
const status=document.getElementById("status");

function speak(text){
 answer.innerText=text;
 let speech=new SpeechSynthesisUtterance(text);
 speech.lang="hi-IN";
 speech.rate=1;
 speechSynthesis.cancel();
 speechSynthesis.speak(speech);
}

function listen(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){
 speak("तुम्हारे ब्राउज़र में Voice Recognition उपलब्ध नहीं है। Chrome में कोशिश करो।");
 return;
 }
 const rec=new SR();
 rec.lang="hi-IN";
 rec.onstart=()=>status.innerText="सुन रहा हूँ...";
 rec.onresult=e=>{
 let text=e.results[0][0].transcript;
 document.getElementById("msg").value=text;
 command(text);
 };
 rec.onerror=()=>status.innerText="दोबारा कोशिश करो";
 rec.onend=()=>status.innerText="तैयार हूँ";
 rec.start();
}

function command(text){
 let t=text.toLowerCase();

 if(t.includes("youtube")){
 speak("YouTube खोल रहा हूँ");
 window.open("https://www.youtube.com","_blank");
 }
 else if(t.includes("whatsapp")){
 speak("WhatsApp खोल रहा हूँ");
 window.open("https://web.whatsapp.com","_blank");
 }
 else if(t.includes("google")||t.includes("गूगल")){
 speak("Google खोल रहा हूँ");
 window.open("https://www.google.com","_blank");
 }
 else if(t.includes("chrome")){
 speak("Chrome में Google खोल रहा हूँ");
 window.open("https://www.google.com","_blank");
 }
 else if(t.includes("नमस्ते")||t.includes("hello")){
 speak("नमस्ते Hunny! कैसे मदद करूँ?");
 }
 else if(t.includes("तुम्हारा नाम")){
 speak("मेरा नाम HUNNY AI है");
 }
 else{
 speak("मैंने सुना: "+text+"। अभी मुझे इस काम के लिए और फीचर्स चाहिए।");
 }
}

function send(){
 let text=document.getElementById("msg").value.trim();
 if(text) command(text);
}
</script>
</body>
</html>
